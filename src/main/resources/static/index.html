<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Reserva de Habitaciones</title>

  <!-- toastify -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"/>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- SweetAlert2 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"/>

  <!-- CSS personalizado -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
<nav class="navbar navbar-expand bg-light mb-4">
  <div class="container">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" href="#" id="optReservas">Reservas</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#" id="optProductos">Productos</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#" id="optUsuarios">Usuarios</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#" id="optFacturas">Facturas</a>
      </li>
    </ul>
  </div>
</nav>




  <!-- Contenedor general con recuadro gris para el contenido -->
  <div class="container mt-5 form-container">
    <!-- Contenedor blanco para encabezados -->
    <div class="header-container mb-4">
      <h1 class="d-flex justify-content-between align-items-center">
        <i class="fa-solid fa-plane-departure"></i>
        <span>Reserva de Habitaciones</span>
        <i class="fa-solid fa-suitcase"></i>
      </h1>
    </div>

    <!-- tabla de facturas -->
    <div id="facturasContainer" class="mt-4" hidden></div>

<!-- CRUD Productos -->
<div id="productosContainer" class="container mt-5" hidden>
  <h2>Gestión de Productos</h2>
  <form id="productoForm" class="row g-3 mb-4">
    <input type="hidden" id="prodId">

    <div class="col-md-6">
      <label for="prodNombre" class="form-label">Nombre</label>
      <input type="text" id="prodNombre" class="form-control" required>
    </div>

    <div class="col-md-4">
      <label for="prodPrecio" class="form-label">Precio</label>
      <input type="number" id="prodPrecio" class="form-control" step="0.01" required>
    </div>

    <div class="col-md-2 d-flex align-items-end">
      <button type="submit" class="btn btn-primary w-100">Guardar</button>
    </div>
  </form>

  <table id="tablaProductos" class="table table-bordered">
    <thead>
      <tr>
        <th>ID</th><th>Nombre</th><th>Precio</th><th>Acciones</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- CRUD Usuarios -->
<div id="usuariosContainer" class="container mt-5" hidden>
  <h2>Gestión de Usuarios</h2>
  <form id="usuarioForm" class="row g-3 mb-4">
    <input type="hidden" id="usuarioId">
    <div class="col-md-4">
      <label for="usuarioNombre" class="form-label">Usuario</label>
      <input type="text" id="usuarioNombre" class="form-control" required>
    </div>
    <div class="col-md-4">
      <label for="usuarioPass" class="form-label">Password</label>
      <input type="password" id="usuarioPass" class="form-control" required>
    </div>
    <div class="col-md-4">
      <label for="usuarioRol" class="form-label">Rol</label>
      <select id="usuarioRol" class="form-select" required>
        <option value="ADMINISTRADOR">ADMINISTRADOR</option>
        <option value="EMPLEADO">EMPLEADO</option>
      </select>
    </div>
    <div class="col-12 text-end">
      <button type="submit" class="btn btn-primary">Guardar Usuario</button>
    </div>
  </form>
  <table id="tablaUsuarios" class="table table-bordered">
    <thead>
      <tr><th>ID</th><th>Usuario</th><th>Rol</th><th>Acciones</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</div>




<!-- FORMULARIO DE RESERVAS -->

    <form id="reservationForm">
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre:</label>
        <input type="text" id="nombre" name="nombre" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="apellido" class="form-label">Apellido:</label>
        <input type="text" id="apellido" name="apellido" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="dni" class="form-label">DNI:</label>
        <input type="text" id="dni" name="dni" class="form-control" required>
      </div>
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="fechaDesde" class="form-label">Fecha Desde:</label>
          <input type="date" id="fechaDesde" name="fechaDesde" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label for="fechaHasta" class="form-label">Fecha Hasta:</label>
          <input type="date" id="fechaHasta" name="fechaHasta" class="form-control" required>
        </div>
      </div>
      <div class="mb-3">
        <label for="habitacion" class="form-label">Habitación:</label>
        <select id="habitacion" name="habitacion" class="form-select" required>
          <option value="">Seleccione una habitación</option>
          <!-- Opciones dinámicas -->
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Reservar</button>
    </form>
  </div>

  <!-- Sección para mostrar la tabla de habitaciones ocupadas -->
  <section class="occupied-section mt-5">
    <div class="container">
      <div class="card">
        <div class="card-header">
          <h2>Habitaciones Ocupadas</h2>
        </div>
        <div class="card-body">
          <table id="tablaOcupadas" class="table table-striped">
            <thead>
              <tr>
                <th>Habitación</th>
                <th>Precio</th>
                <th>Huésped</th>
                <th>Fecha Desde</th>
                <th>Fecha Hasta</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              <!-- Las filas se insertarán dinámicamente -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

  <!-- para la factura en pdf -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.23/dist/jspdf.plugin.autotable.min.js"></script>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- SweetAlert2 JS -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- JavaScript-->
  <script src="js/script.js"></script>
</body>

</html>
